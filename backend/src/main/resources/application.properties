spring.application.name=finsage

# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
jwt.secret=

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server
server.port=8080

# Mail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Tesseract
tesseract.datapath=

# Deployment settings (set these via your .env / hosting provider's env vars —
# do NOT hardcode them here):
#   FRONTEND_URL   - the deployed frontend origin, e.g. https://app.yourdomain.com
#                    (defaults to http://localhost:3000 for local dev)
#   COOKIE_SECURE  - set to "true" once the app is served over HTTPS, so the
#                    auth cookie is sent with Secure + SameSite=None
#                    (defaults to "false" for local dev over plain HTTP)

# Redis (AI response caching, login rate limiting, JWT revocation)
# Set REDIS_HOST / REDIS_PORT / REDIS_PASSWORD in .env for a remote/managed Redis
# (e.g. Redis Cloud, Upstash). Defaults below assume a local Redis on the default port
# (e.g. `docker run -p 6379:6379 redis` or a local `redis-server`).
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Spring AI — routes through OpenRouter's OpenAI-compatible API.
# Reuses the SAME OPENROUTER_KEY / OPENROUTER_MODEL env vars you already have
# (see openrouter.key / openrouter.model below, populated from .env). No new
# env vars required. base-url is OpenRouter's fixed API root, not derived from
# OPENROUTER_URL (which historically held the full /v1/chat/completions path).
spring.ai.openai.api-key=${openrouter.key:}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=${openrouter.model:nvidia/nemotron-3.5-lightning:free}
# Don't let a slow/unavailable AI provider hang requests indefinitely.
spring.ai.retry.max-attempts=2

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=10000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized


# Flyway: database migration
# Runs on startup before Hibernate validation. Creates flyway_schema_history table to track applied migrations.
# Place migration files in src/main/resources/db/migration/ (e.g., V1__initial_schema.sql)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false